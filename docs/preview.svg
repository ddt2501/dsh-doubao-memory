<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#8b949e"/>
    </marker>
    <marker id="arrT" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5fd0c4"/>
    </marker>
  </defs>

  <rect x="12" y="12" width="616" height="336" rx="16" fill="none" stroke="#8b949e" stroke-opacity="0.28" stroke-width="1.5"/>
  <text x="320" y="34" text-anchor="middle" font-size="12" fill="#8b949e" font-weight="600">双层记忆：SQLite 存事实（会遗忘）· 工具按需召回 · wiki 抽象成人格</text>

  <!-- conversation -->
  <rect x="26" y="120" width="118" height="96" rx="12" fill="#6ea8fe" fill-opacity="0.12" stroke="#6ea8fe" stroke-width="1.5"/>
  <text x="85" y="146" text-anchor="middle" font-size="11" fill="#6ea8fe" font-weight="600">每轮对话</text>
  <text x="85" y="166" text-anchor="middle" font-size="10" fill="#8b949e">用户 ⇄ 助手</text>
  <text x="85" y="184" text-anchor="middle" font-size="9" fill="#8b949e">消息 · 反应</text>

  <!-- plugin host -->
  <rect x="172" y="60" width="252" height="212" rx="14" fill="#5cc98a" fill-opacity="0.08" stroke="#5cc98a" stroke-width="1.5"/>
  <text x="298" y="80" text-anchor="middle" font-size="11" fill="#5cc98a" font-weight="600">插件（Host 进程内）</text>
  <rect x="186" y="92" width="224" height="30" rx="8" fill="#5cc98a" fill-opacity="0.16"/>
  <text x="298" y="111" text-anchor="middle" font-size="10" fill="#8b949e">住相 · 人格映射（主题，非检索）</text>
  <rect x="186" y="128" width="224" height="30" rx="8" fill="#5cc98a" fill-opacity="0.16"/>
  <text x="298" y="147" text-anchor="middle" font-size="10" fill="#8b949e">搭讪 · 判定 → 生成 → 投递</text>
  <rect x="186" y="164" width="224" height="30" rx="8" fill="#5fd0c4" fill-opacity="0.18"/>
  <text x="298" y="183" text-anchor="middle" font-size="10" fill="#5fd0c4">recall_memory / memory_get 工具</text>
  <rect x="186" y="200" width="224" height="30" rx="8" fill="#5cc98a" fill-opacity="0.16"/>
  <text x="298" y="219" text-anchor="middle" font-size="10" fill="#8b949e">JitRL · 优势调制（搭讪主题）</text>
  <text x="298" y="252" text-anchor="middle" font-size="9" fill="#8b949e">gist 轻召回 · 出处按需取 · 零额外调用</text>

  <!-- persona directory -->
  <rect x="452" y="60" width="164" height="212" rx="14" fill="#f0b34a" fill-opacity="0.1" stroke="#f0b34a" stroke-width="1.5"/>
  <text x="534" y="80" text-anchor="middle" font-size="11" fill="#f0b34a" font-weight="600">人格目录 dataRoot</text>
  <rect x="464" y="92" width="140" height="40" rx="7" fill="#5fd0c4" fill-opacity="0.18" stroke="#5fd0c4" stroke-width="1.2"/>
  <text x="534" y="108" text-anchor="middle" font-size="9.5" fill="#5fd0c4" font-weight="600">SQLite 事实记忆</text>
  <text x="534" y="123" text-anchor="middle" font-size="8.5" fill="#8b949e">gist/detail 分层 · 遗忘衰减</text>
  <line x1="534" y1="132" x2="534" y2="146" stroke="#5fd0c4" stroke-width="1.6" marker-end="url(#arrT)"/>
  <text x="560" y="142" text-anchor="middle" font-size="8" fill="#5fd0c4">抽象</text>
  <rect x="464" y="148" width="140" height="40" rx="7" fill="#f0b34a" fill-opacity="0.16"/>
  <text x="534" y="164" text-anchor="middle" font-size="9.5" fill="#8b949e" font-weight="600">VAULT wiki</text>
  <text x="534" y="179" text-anchor="middle" font-size="8.5" fill="#8b949e">人格材料 · 洞察/断言</text>
  <rect x="464" y="196" width="140" height="30" rx="7" fill="#f0b34a" fill-opacity="0.14"/>
  <text x="534" y="215" text-anchor="middle" font-size="9.5" fill="#8b949e">SOUL · 人格锚点</text>
  <rect x="464" y="232" width="140" height="30" rx="7" fill="#f0b34a" fill-opacity="0.14"/>
  <text x="534" y="251" text-anchor="middle" font-size="9.5" fill="#8b949e">RAW · 每日摘要</text>

  <!-- phase service -->
  <rect x="172" y="296" width="444" height="34" rx="9" fill="#c58cf5" fill-opacity="0.12" stroke="#c58cf5" stroke-width="1.3"/>
  <text x="394" y="310" text-anchor="middle" font-size="9.5" fill="#c58cf5">phase 服务 · cron → headless 子进程（静默 · 可审计）</text>
  <text x="394" y="323" text-anchor="middle" font-size="8.5" fill="#8b949e">ingest 抽取→SQLite · wiki 抽象 · lint 衰减 · reflect 末那识</text>

  <!-- arrows -->
  <line x1="144" y1="168" x2="172" y2="168" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- tool recall: plugin tool row -> SQLite (polyline up to fact layer) -->
  <polyline points="424,179 440,179 440,112 452,112" fill="none" stroke="#5fd0c4" stroke-width="1.6" marker-end="url(#arrT)"/>
  <!-- wiki themes -> snapshot -->
  <line x1="452" y1="168" x2="424" y2="168" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="298" y1="272" x2="298" y2="296" stroke="#8b949e" stroke-width="1.6"/>
  <line x1="534" y1="272" x2="534" y2="296" stroke="#8b949e" stroke-width="1.6"/>

  <!-- labels -->
  <text x="158" y="160" text-anchor="middle" font-size="8" fill="#8b949e">触发</text>
  <text x="440" y="104" text-anchor="middle" font-size="7.5" fill="#5fd0c4">召回/强化</text>
  <text x="438" y="184" text-anchor="middle" font-size="8" fill="#8b949e">主题</text>
</svg>